# Wersja przeglądarkowa (iPhone: Safari → Udostępnij → „Do ekranu początkowego”):
# budowa (flet publish — Python w przeglądarce), test w silniku Safari z profilem iPhone'a,
# publikacja na GitHub Pages: https://<użytkownik>.github.io/Matrix-Finance-Mobile/
name: iPhone (wersja webowa)

on:
  workflow_dispatch:
    inputs:
      publikuj:
        description: "Opublikuj na GitHub Pages"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-test:
    name: Budowa i test (WebKit / iPhone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "flet[all]==1.1.3" playwright
      - name: flet publish
        run: |
          find . -name __pycache__ -prune -exec rm -rf {} +
          flet publish . --distpath web-dist --app-name "Matrix Finance" --app-short-name "Matrix" \
            --app-description "Budżet domowy z oszczędzaniem kopertowym" \
            --base-url "/${{ github.event.repository.name }}/" --route-url-strategy hash \
            --pwa-background-color "#000000" --pwa-theme-color "#00FF41" -a app/assets
          ls -la web-dist
      - name: Test w silniku Safari (WebKit, iPhone 15)
        run: |
          python -m playwright install --with-deps webkit
          mkdir -p srv && cp -r web-dist "srv/${{ github.event.repository.name }}"
          (cd srv && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          python tools/test_web_iphone.py "http://localhost:8000/${{ github.event.repository.name }}/" zrzuty-iphone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-iphone
          path: zrzuty-iphone/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  deploy:
    name: Publikacja (GitHub Pages)
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publikuj)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Podpowiedź — strona nie jest włączona
        if: failure()
        run: |
          echo "::error::GitHub Pages nie jest włączone. Jednorazowo: Settings → Pages → Build and deployment → Source: GitHub Actions, potem uruchom ten workflow ponownie."
          {
            echo "### GitHub Pages nie jest włączone"
            echo "Jednorazowo: **Settings → Pages → Build and deployment → Source: GitHub Actions**,"
            echo "potem **Actions → iPhone (wersja webowa) → Run workflow** (albo *Re-run jobs*)."
          } >> "$GITHUB_STEP_SUMMARY"
      - id: deployment
        uses: actions/deploy-pages@v4
