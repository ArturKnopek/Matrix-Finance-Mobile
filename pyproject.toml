[project]
name = "matrix-finance-mobile"
version = "1.3.0"
description = "Matrix Finance — budżet domowy z oszczędzaniem kopertowym (Android), synchronizacja z komputerem przez OneDrive"
readme = "README.md"
requires-python = ">=3.12"
# Uwaga: bez pakietu „cryptography” — silnik ma zgodną implementację szyfrowania w czystym Pythonie
# (src/utils/fernet_compat.py), więc budowanie na Androida nie zależy od skompilowanych bibliotek.
dependencies = ["flet==1.1.3", "certifi"]

[project.optional-dependencies]
dev = ["flet[all]==1.1.3", "pytest>=8"]

[tool.flet]
org = "pl.matrixfinance"
product = "Matrix Finance"
company = "Matrix Finance"
copyright = "Licencja MIT"

[tool.flet.app]
path = "app"

[tool.flet.web]
# wersja przeglądarkowa (iPhone): Python w przeglądarce (Pyodide); sqlite3 jest w jego bibliotece standardowej
dependencies = ["flet==1.1.3"]

[tool.flet.android]
split_per_abi = false

[tool.pytest.ini_options]
testpaths = ["tests"]
